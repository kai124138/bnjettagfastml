apiVersion: batch/v1
kind: Job
metadata:
  name: kai-bn-fixed-max-fast
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 172800   # 48h safety cap (EarlyStopping patience=5 usually stops sooner)
  template:
    spec:
      restartPolicy: Never
      affinity:
        nodeAffinity:
          # REQUIRED: x86 AND a GPU meaningfully faster than the RTX-2080-Ti. Broad strong set
          # (~130 nodes) so it never sits Pending; excludes the ARM GH200 (x86-only TF image).
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: kubernetes.io/arch
                operator: In
                values: [amd64]
              - key: nvidia.com/gpu.product
                operator: In
                values:
                - NVIDIA-A100-SXM4-80GB
                - NVIDIA-A100-80GB-PCIe
                - NVIDIA-A100-PCIE-40GB
                - NVIDIA-H100-80GB-HBM3
                - NVIDIA-H200-NVL
                - NVIDIA-RTX-PRO-6000-Blackwell-Max-Q-Workstation-Edition
                - NVIDIA-GeForce-RTX-4090
                - NVIDIA-L40S
                - NVIDIA-L40
                - NVIDIA-RTX-A6000
                - NVIDIA-A40
                - NVIDIA-RTX-A5000
                - NVIDIA-GeForce-RTX-3090
          # PREFERRED: grab the fastest available among the strong set.
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            preference:
              matchExpressions:
              - key: nvidia.com/gpu.product
                operator: In
                values: [NVIDIA-H200-NVL, NVIDIA-H100-80GB-HBM3, NVIDIA-RTX-PRO-6000-Blackwell-Max-Q-Workstation-Edition]
          - weight: 90
            preference:
              matchExpressions:
              - key: nvidia.com/gpu.product
                operator: In
                values: [NVIDIA-A100-SXM4-80GB, NVIDIA-A100-80GB-PCIe, NVIDIA-GeForce-RTX-4090, NVIDIA-L40S]
          - weight: 80
            preference:
              matchExpressions:
              - key: nvidia.com/gpu.product
                operator: In
                values: [NVIDIA-A100-PCIE-40GB, NVIDIA-L40, NVIDIA-RTX-A6000]
          - weight: 60
            preference:
              matchExpressions:
              - key: nvidia.com/gpu.product
                operator: In
                values: [NVIDIA-A40, NVIDIA-RTX-A5000, NVIDIA-GeForce-RTX-3090]
      containers:
      - name: train
        image: tensorflow/tensorflow:2.11.1-gpu
        command: ["bash", "-c"]
        args:
        - |
          set -eo pipefail
          export MPLBACKEND=Agg
          CODE=/data/BNJetTag
          OUT=/data/outputs/qk-fixed-max-fast
          mkdir -p "$OUT/bitnet" "$OUT/v1/bitnet"
          echo "[setup] $(date) deps"
          apt-get update -qq && apt-get install -y -qq graphviz
          pip install -q qkeras==0.9.0 "tensorflow==2.11.1" "matplotlib<3.8" pandas seaborn mplhep pydot scikit-learn h5py wandb
          ( grep -rl " | " --include="*.py" "$CODE" 2>/dev/null | while read f; do grep -q "from __future__ import annotations" "$f" || sed -i '1i from __future__ import annotations' "$f"; done ) || true
          nvidia-smi --query-gpu=name,memory.total --format=csv,noheader || true
          export PYTHONPATH="$CODE:$PYTHONPATH"
          export WANDB_PROJECT=bnjettag-bitnet
          export WANDB_RUN_NAME=fixed-max-fast-D256-L8-FFN1024-lr2e4-wu3
          export BN_D_MODEL=256 BN_N_HEADS=8 BN_N_LAYERS=8 BN_FFN_DIM=1024
          export BN_LR=0.0002 BN_WARMUP_EPOCHS=3
          echo "[train] $(date) FIXED max + stability (strong GPU)  D=256 H=8 L=8 FFN=1024  LR=2e-4 warmup=3 clipnorm=1.0  EPOCHS=200"
          cd "$OUT"
          python -u "$CODE/qkerasModel.py" \
            /data/bnjet/train_merged/merged_trainPart.h5 \
            /data/bnjet/QCD_Pt15To3000_Flat_PU200/Bkg_train.h5 \
            /data/bnjet/train_merged/merged_trainJet.h5 \
            /data/bnjet/QCD_Pt15To3000_Flat_PU200/Bkg_trainJets.h5 \
            2>&1 | tee "$OUT/train_fixed_max_fast.log"
          echo "[done] $(date) fixed-max-fast"
        env:
        - name: WANDB_API_KEY
          valueFrom:
            secretKeyRef:
              name: kai-wandb
              key: WANDB_API_KEY
        resources:
          limits:
            nvidia.com/gpu: "1"
            memory: 24Gi
            cpu: "4"
          requests:
            nvidia.com/gpu: "1"
            memory: 24Gi
            cpu: "4"
        volumeMounts:
        - name: data
          mountPath: /data
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: kai-data
