apiVersion: v1
kind: Pod
metadata:
  name: kai-hls-dev
spec:
  restartPolicy: Never
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
        - matchExpressions:
          - key: kubernetes.io/arch
            operator: In
            values: [amd64]
  containers:
  - name: hls
    image: tensorflow/tensorflow:2.11.1-gpu   # same image as training => qkeras model loads identically
    command: ["sleep", "infinity"]
    resources:
      limits:
        memory: 16Gi
        cpu: "4"
      requests:
        memory: 12Gi
        cpu: "2"
    volumeMounts:
    - name: data
      mountPath: /data
  volumes:
  - name: data
    persistentVolumeClaim:
      claimName: kai-data
