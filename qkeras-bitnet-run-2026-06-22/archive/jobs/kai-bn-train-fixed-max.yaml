apiVersion: batch/v1
kind: Job
metadata:
  name: kai-bn-fixed-max
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 172800   # 48h safety cap (EarlyStopping patience=5 usually stops sooner)
  template:
    spec:
      restartPolicy: Never
      affinity:
        nodeAffinity:
          # REQUIRED: x86 only -> the TF 2.11.1 image is amd64; this excludes the ARM GH200 node.
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: kubernetes.io/arch
                operator: In
                values: [amd64]
          # PREFERRED (not required -> never Pending): bias toward the fastest GPUs.
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            preference:
              matchExpressions:
              - key: nvidia.com/gpu.product
                operator: In
                values: [NVIDIA-H200-NVL]
          - weight: 90
            preference:
              matchExpressions:
              - key: nvidia.com/gpu.product
                operator: In
                values: [NVIDIA-H100-80GB-HBM3]
          - weight: 80
            preference:
              matchExpressions:
              - key: nvidia.com/gpu.product
                operator: In
                values: [NVIDIA-A100-SXM4-80GB]
      containers:
      - name: train
        image: tensorflow/tensorflow:2.11.1-gpu
        command: ["bash", "-c"]
        args:
        - |
          set -eo pipefail
          export MPLBACKEND=Agg
          CODE=/data/BNJetTag
          OUT=/data/outputs/qk-fixed-max
          mkdir -p "$OUT/bitnet" "$OUT/v1/bitnet"
          echo "[setup] $(date) deps"
          apt-get update -qq && apt-get install -y -qq graphviz
          pip install -q qkeras==0.9.0 "tensorflow==2.11.1" "matplotlib<3.8" pandas seaborn mplhep pydot scikit-learn h5py wandb
          ( grep -rl " | " --include="*.py" "$CODE" 2>/dev/null | while read f; do grep -q "from __future__ import annotations" "$f" || sed -i '1i from __future__ import annotations' "$f"; done ) || true
          nvidia-smi --query-gpu=name,memory.total --format=csv,noheader || true
          export PYTHONPATH="$CODE:$PYTHONPATH"
          export WANDB_PROJECT=bnjettag-bitnet
          export WANDB_RUN_NAME=fixed-max-D256-L8-FFN1024
          export BN_D_MODEL=256 BN_N_HEADS=8 BN_N_LAYERS=8 BN_FFN_DIM=1024
          echo "[train] $(date) FIXED max (gradient-flow fixes)  D=256 H=8 L=8 FFN=1024  EPOCHS=200 (EarlyStopping patience=5)"
          cd "$OUT"
          python -u "$CODE/qkerasModel.py" \
            /data/bnjet/train_merged/merged_trainPart.h5 \
            /data/bnjet/QCD_Pt15To3000_Flat_PU200/Bkg_train.h5 \
            /data/bnjet/train_merged/merged_trainJet.h5 \
            /data/bnjet/QCD_Pt15To3000_Flat_PU200/Bkg_trainJets.h5 \
            2>&1 | tee "$OUT/train_fixed_max.log"
          echo "[done] $(date) fixed-max"
        env:
        - name: WANDB_API_KEY
          valueFrom:
            secretKeyRef:
              name: kai-wandb
              key: WANDB_API_KEY
        resources:
          limits:
            nvidia.com/gpu: "1"
            memory: 24Gi
            cpu: "4"
          requests:
            nvidia.com/gpu: "1"
            memory: 24Gi
            cpu: "4"
        volumeMounts:
        - name: data
          mountPath: /data
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: kai-data
