apiVersion: v1
kind: Pod
metadata:
  name: kai-setup
spec:
  restartPolicy: Never
  containers:
  - name: setup
    image: ubuntu:22.04
    command: ["sleep", "infinity"]
    resources:
      limits:
        memory: 1Gi
        cpu: "1"
      requests:
        memory: 512Mi
        cpu: "500m"
    volumeMounts:
    - name: data
      mountPath: /data
  volumes:
  - name: data
    persistentVolumeClaim:
      claimName: kai-data
